[workspace]
resolver = "3"
members = ["crates/dagos-core", "crates/dagos-openai", "crates/dagos-mcp", "crates/dagos"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Mnehmos/dagos"

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep debug builds small: line tables are enough for readable panics and backtraces in DAGOS's
# own crates, and dependencies need no debug info at all. Full debug info made every test binary
# large, and the build directory grew to tens of gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
