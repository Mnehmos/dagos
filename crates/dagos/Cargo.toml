[package]
name = "dagos"
description = "DAGOS transport: command-line interface to the core runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
dagos-core = { path = "../dagos-core" }
dagos-openai = { path = "../dagos-openai" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
