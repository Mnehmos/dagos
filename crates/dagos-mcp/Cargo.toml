[package]
name = "dagos-mcp"
description = "Optional MCP tools for DAGOS: discovery, per-tool policies, and tool calls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
dagos-core = { path = "../dagos-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
